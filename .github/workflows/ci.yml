name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/browser-utils.test.mjs
      - run: docker compose --profile test up -d --wait test-db test-redis test-rabbit
      - run: uv run --locked pytest --cov=campuspay --cov-report=term-missing --junitxml=docs/test-results.xml
      - name: Container smoke test
        run: |
          docker compose up -d --build --wait
          uv run --locked python scripts/demo.py
      - if: always()
        run: docker compose --profile test logs --no-color --tail=80
      - if: always()
        run: docker compose --profile test down
